# /etc/nginx/sites-available/firetrack
# HTTP uniquement : certbot ajoutera lui-même le bloc SSL (certbot --nginx -d firetrack.harari.ovh)

server {
    listen 80;
    server_name firetrack.harari.ovh;

    # IMPORTANT : dossier généré par "npm run build --prefix frontend"
    root /var/www/firetrack/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets Vite (hashés automatiquement)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Données du pipeline : servies directement depuis public/data (mises à jour par le cron
    # sans rebuild). Cache court pour que les nouveaux jours apparaissent vite.
    location /data/ {
        alias /var/www/firetrack/frontend/public/data/;
        expires 15m;
        add_header Cache-Control "public";
        gzip on;
        gzip_types application/json;
    }

    # Sécurité basique
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/firetrack_error.log;
    access_log /var/log/nginx/firetrack_access.log;
}

# Redirection www -> sans www
server {
    listen 80;
    server_name www.firetrack.harari.ovh;
    return 301 http://firetrack.harari.ovh$request_uri;
}
